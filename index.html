<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>НАБ ТехОблік</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    margin: 0;
    padding: 24px 16px;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 8px;
  }
  .card {
    background: var(--tg-theme-secondary-bg-color, #f2f2f7);
    border-radius: 12px;
    padding: 16px;
    margin-top: 24px;
    text-align: left;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .label { opacity: 0.6; }
  .status {
    margin-top: 16px;
    font-size: 13px;
    opacity: 0.7;
  }
</style>
</head>
<body>

  <h1>НАБ ТехОблік — тест підключення</h1>
  <p>Якщо ти бачиш свої дані нижче — Mini App успішно зчитала Telegram ID.</p>

  <div class="card" id="data-card">
    <div class="row"><span class="label">telegram_id</span><span id="tg-id">—</span></div>
    <div class="row"><span class="label">Ім'я</span><span id="tg-name">—</span></div>
    <div class="row"><span class="label">Username</span><span id="tg-username">—</span></div>
  </div>

  <p class="status" id="status">Ініціалізація...</p>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById('status');
  const user = tg.initDataUnsafe?.user;

  if (user) {
    document.getElementById('tg-id').textContent = user.id;
    document.getElementById('tg-name').textContent = (user.first_name || '') + ' ' + (user.last_name || '');
    document.getElementById('tg-username').textContent = user.username ? '@' + user.username : '—';
    statusEl.textContent = 'Готово. Дані успішно отримано від Telegram.';
  } else {
    statusEl.textContent = 'Дані користувача не знайдено. Можливо, сторінку відкрито не через Telegram-бота (наприклад, напряму в звичайному браузері) — це очікувано поза Telegram.';
  }
</script>

</body>
</html>
