<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>НАБ ТехОблік</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #999999);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --border: rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; color: var(--text); font-size: 15px; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 16px;
    font-weight: 600;
    margin-top: 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  .hidden { display: none !important; }
  .msg {
    text-align: center;
    padding: 40px 16px;
    color: var(--hint);
  }
  .success-box {
    text-align: center;
    padding: 30px 16px;
  }
  .success-box .id {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin: 12px 0;
  }
  .error-text {
    color: #e53935;
    font-size: 13px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="msg" id="loading">Завантаження...</div>
</div>

<script>
const SUPABASE_URL = 'https://ypnfujxcwgfjmewrsqus.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MJXHjWXDkky9Xhvh7i-Viw_Q4Gedb8r';

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const app = document.getElementById('app');

// ---------- Допоміжні функції роботи з Supabase REST API ----------

async function supaGet(table, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    }
  });
  if (!res.ok) throw new Error(`Помилка запиту до ${table}: ${res.status}`);
  return res.json();
}

async function supaInsert(table, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(data)
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Помилка запису в ${table}: ${errText}`);
  }
  return res.json();
}

async function supaRpc(fnName, params) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(params)
  });
  if (!res.ok) throw new Error(`Помилка виклику функції ${fnName}`);
  return res.json();
}

// ---------- Головна логіка ----------

async function main() {
  const tgUser = tg.initDataUnsafe?.user;

  if (!tgUser) {
    renderMessage('Не вдалося визначити користувача. Відкрий цю сторінку через кнопку меню бота в Telegram.');
    return;
  }

  let users;
  try {
    users = await supaGet('users', `telegram_id=eq.${tgUser.id}&select=id,full_name,role,status`);
  } catch (e) {
    renderMessage('Помилка з\'єднання з базою даних: ' + e.message);
    return;
  }

  if (!users || users.length === 0) {
    renderMessage('Тебе не знайдено в системі. Зверніться до адміністратора.');
    return;
  }

  const currentUser = users[0];

  if (currentUser.status !== 'Активний') {
    renderMessage('Твій обліковий запис неактивний. Зверніться до адміністратора.');
    return;
  }

  if (currentUser.role === 'Оператор') {
    await renderOperatorForm(currentUser);
  } else {
    renderMessage(`Роль "${currentUser.role}" поки не реалізована в цій версії Mini App. Скоро буде.`);
  }
}

function renderMessage(text) {
  app.innerHTML = `<div class="msg">${text}</div>`;
}

// ---------- Екран оператора: форма щоденного звіту ----------

async function renderOperatorForm(user) {
  let myEquipment, objects;

  try {
    myEquipment = await supaGet(
      'user_equipment',
      `user_id=eq.${user.id}&status=eq.Активна&select=equipment_id,equipment(id,name)`
    );
    objects = await supaGet('objects', `status=eq.Активний&select=id,name`);
  } catch (e) {
    renderMessage('Помилка завантаження довідників: ' + e.message);
    return;
  }

  if (!myEquipment || myEquipment.length === 0) {
    renderMessage('За тобою не закріплено жодної техніки. Зверніться до адміністратора.');
    return;
  }

  const today = new Date().toISOString().split('T')[0];

  const equipmentOptions = myEquipment
    .map(ue => `<option value="${ue.equipment.id}">${ue.equipment.name}</option>`)
    .join('');
  const objectOptions = objects
    .map(o => `<option value="${o.id}">${o.name}</option>`)
    .join('');

  app.innerHTML = `
    <h1>Внести дані</h1>
    <div class="sub">Оператор: ${user.full_name}</div>

    <form id="report-form">
      <div class="card">
        <label>Дата роботи</label>
        <input type="date" id="work_date" value="${today}" required>

        <label>Техніка</label>
        <select id="equipment_id" required>${equipmentOptions}</select>

        <label>Об'єкт</label>
        <select id="object_id" required>${objectOptions}</select>

        <label>Відповідальний за об'єкт</label>
        <input type="text" id="responsible_display" disabled placeholder="Визначається автоматично">
      </div>

      <div class="card">
        <label>Мотогодини</label>
        <div class="row2">
          <div>
            <label>Початок</label>
            <input type="number" step="0.1" id="start_hours" required>
          </div>
          <div>
            <label>Кінець</label>
            <input type="number" step="0.1" id="end_hours" required>
          </div>
        </div>
      </div>

      <div class="card">
        <label>Час роботи</label>
        <div class="row2">
          <div>
            <label>Початок</label>
            <input type="time" id="start_time" required>
          </div>
          <div>
            <label>Кінець</label>
            <input type="time" id="end_time" required>
          </div>
        </div>
        <label>Обід, год</label>
        <input type="number" step="0.1" id="lunch_hours" value="0">
      </div>

      <div class="card">
        <label>Переїзд, год</label>
        <input type="number" step="0.1" id="travel_hours" value="0">
        <label>Опис маршруту</label>
        <input type="text" id="travel_route" placeholder="Звідки → куди">
      </div>

      <div class="card">
        <label>Простій, год</label>
        <input type="number" step="0.1" id="downtime_hours" value="0">
        <label>Причина простою</label>
        <input type="text" id="downtime_reason">
      </div>

      <div class="card">
        <label>Заправка, л</label>
        <input type="number" step="0.1" id="fueling_liters" value="0">

        <div class="checkbox-row">
          <input type="checkbox" id="has_breakdown">
          <label for="has_breakdown">Була поломка</label>
        </div>

        <div id="repair-block" class="hidden">
          <label>Ремонт, год</label>
          <input type="number" step="0.1" id="repair_hours" value="0">
        </div>
      </div>

      <div class="card">
        <label>Примітка</label>
        <textarea id="operator_note"></textarea>
      </div>

      <button type="submit" id="submit-btn">Подати звіт</button>
      <div class="error-text hidden" id="error-box"></div>
    </form>
  `;

  // Показ/приховування блоку ремонту
  document.getElementById('has_breakdown').addEventListener('change', (e) => {
    document.getElementById('repair-block').classList.toggle('hidden', !e.target.checked);
  });

  // Автовизначення відповідального при виборі об'єкта
  async function updateResponsible() {
    const objectId = document.getElementById('object_id').value;
    const respDisplay = document.getElementById('responsible_display');
    respDisplay.value = 'Завантаження...';
    try {
      const links = await supaGet(
        'object_responsible',
        `object_id=eq.${objectId}&status=eq.Активний&select=user_id,users(full_name)`
      );
      if (links && links.length > 0) {
        respDisplay.value = links[0].users.full_name;
        respDisplay.dataset.userId = links[0].user_id;
      } else {
        respDisplay.value = 'Не призначено';
        respDisplay.dataset.userId = '';
      }
    } catch (e) {
      respDisplay.value = 'Помилка визначення';
    }
  }

  document.getElementById('object_id').addEventListener('change', updateResponsible);
  await updateResponsible(); // одразу для першого об'єкта в списку

  // Відправка форми
  document.getElementById('report-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    errorBox.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Відправка...';

    try {
      const responsibleId = document.getElementById('responsible_display').dataset.userId;
      if (!responsibleId) {
        throw new Error('Не визначено відповідального за цей об\'єкт.');
      }

      const startTime = document.getElementById('start_time').value;
      const endTime = document.getElementById('end_time').value;
      const lunchHours = parseFloat(document.getElementById('lunch_hours').value) || 0;

      // Розрахунок людиногодин: різниця часу мінус обід
      const [sh, sm] = startTime.split(':').map(Number);
      const [eh, em] = endTime.split(':').map(Number);
      let diffHours = (eh + em / 60) - (sh + sm / 60);
      if (diffHours < 0) diffHours += 24;
      const totalPersonHours = Math.round((diffHours - lunchHours) * 100) / 100;

      const newId = await supaRpc('next_id', { p_prefix: 'REP' });

      const payload = {
        id: newId,
        work_date: document.getElementById('work_date').value,
        operator_id: user.id,
        equipment_id: document.getElementById('equipment_id').value,
        object_id: document.getElementById('object_id').value,
        responsible_id: responsibleId,
        start_hours: parseFloat(document.getElementById('start_hours').value),
        end_hours: parseFloat(document.getElementById('end_hours').value),
        start_time: startTime,
        end_time: endTime,
        lunch_hours: lunchHours,
        total_person_hours: totalPersonHours,
        travel_hours: parseFloat(document.getElementById('travel_hours').value) || 0,
        travel_route: document.getElementById('travel_route').value || null,
        downtime_hours: parseFloat(document.getElementById('downtime_hours').value) || 0,
        downtime_reason: document.getElementById('downtime_reason').value || null,
        fueling_liters: parseFloat(document.getElementById('fueling_liters').value) || 0,
        has_breakdown: document.getElementById('has_breakdown').checked,
        repair_hours: parseFloat(document.getElementById('repair_hours')?.value) || 0,
        operator_note: document.getElementById('operator_note').value || null
      };

      await supaInsert('daily_reports', payload);

      app.innerHTML = `
        <div class="success-box">
          <div>Звіт успішно подано!</div>
          <div class="id">${newId}</div>
          <div class="sub">Статус: Очікує відповідального</div>
        </div>
      `;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Подати звіт';
    }
  });
}

main();
</script>

</body>
</html>
